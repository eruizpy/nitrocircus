# Redis configuration for NitroCircus
# Optimized for queue management and distributed locking

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (backup)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Networking
timeout 300
tcp-keepalive 60
bind 0.0.0.0
protected-mode yes

# Slow log (monitor slow operations)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Limits
maxclients 10000

# Advanced
loglevel notice
databases 16
