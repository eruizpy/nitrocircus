name: Check Agent Runner

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== PM2 status ==="
            pm2 list

            echo ""
            echo "=== Agent-runner logs (last 50 lines) ==="
            pm2 logs nitrocircus-agents --lines 50 --nostream

            echo ""
            echo "=== Redis queue lengths ==="
            echo -n "queue:frontend -> "; docker exec nitrocircus-redis-1 redis-cli LLEN queue:frontend
            echo -n "queue:backend  -> "; docker exec nitrocircus-redis-1 redis-cli LLEN queue:backend
            echo -n "queue:devops   -> "; docker exec nitrocircus-redis-1 redis-cli LLEN queue:devops

            echo ""
            echo "=== Claude CLI check ==="
            which claude && claude --version || echo "claude CLI NOT FOUND"
