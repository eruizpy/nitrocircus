<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NitroCircus — Miniverse</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
      overflow: hidden;
    }

    #hud {
      width: 800px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.85);
      border-bottom: 2px solid #FFD600;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      flex-shrink: 0;
    }
    #hud .logo { font-weight: bold; color: #FFD600; letter-spacing: 2px; font-size: 12px; }
    #ws-status { display: flex; align-items: center; gap: 4px; }
    #ws-dot { width: 7px; height: 7px; border-radius: 50%; background: #8a8aa0; flex-shrink: 0; }
    #ws-dot.connected { background: #2ECC71; }
    #ws-dot.error { background: #e74c3c; }
    .hud-hint { color: #8a8aa0; margin-left: auto; font-size: 10px; }
    kbd { background: #222; padding: 1px 5px; border-radius: 2px; border: 1px solid #444; }

    #world-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: default;
    }

    /* Agent status sidebar */
    #status-bar {
      position: fixed;
      top: 38px;
      left: calc(50% - 400px - 160px);
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }
    .agent-card {
      background: rgba(10,10,20,0.9);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 10px;
      border-left: 3px solid #444;
    }
    .agent-card .agent-name { font-weight: bold; margin-bottom: 2px; }
    .agent-card .agent-task { color: #8a8aa0; font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
    .agent-card .agent-state-label { font-size: 9px; margin-top: 1px; }

    /* Speech log */
    #speech-log {
      position: fixed;
      top: 38px;
      left: calc(50% + 400px + 8px);
      width: 180px;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }
    .speech-item {
      background: rgba(10,10,20,0.9);
      border-left: 3px solid #FFD600;
      padding: 5px 8px;
      font-size: 10px;
      border-radius: 0 4px 4px 0;
      animation: slideIn 0.2s ease;
    }
    .speech-item .speech-agent { font-weight: bold; margin-bottom: 2px; }
    .speech-item .speech-msg { color: #ccc; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Claude editor panel */
    #editor-panel {
      position: fixed;
      bottom: 0;
      left: calc(50% - 400px);
      width: 800px;
      background: rgba(13,13,26,0.97);
      border-top: 2px solid #FFD600;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    #editor-panel.open { display: flex; }
    #editor-label { color: #FFD600; font-size: 11px; white-space: nowrap; }
    #editor-input {
      flex: 1;
      background: #1a1a2e;
      color: #fff;
      border: 1px solid #444;
      padding: 7px 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 3px;
      outline: none;
    }
    #editor-input:focus { border-color: #FFD600; }
    #editor-send {
      background: #FFD600;
      color: #0d0d0d;
      border: none;
      padding: 7px 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 3px;
      white-space: nowrap;
    }
    #editor-send:hover { background: #ffe033; }
    #editor-send:disabled { opacity: 0.4; cursor: not-allowed; }
    #editor-thinking { color: #8a8aa0; font-size: 10px; display: none; white-space: nowrap; }
    #editor-close { color: #8a8aa0; cursor: pointer; font-size: 16px; line-height: 1; padding: 4px; }
    #editor-close:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="hud">
    <span class="logo">⚡ NITROCIRCUS</span>
    <div id="ws-status">
      <div id="ws-dot"></div>
      <span id="ws-label">connecting…</span>
    </div>
    <span class="hud-hint">Press <kbd>E</kbd> to edit with Claude · <kbd>Esc</kbd> close</span>
  </div>

  <canvas id="world-canvas" width="800" height="560"></canvas>

  <div id="status-bar"></div>
  <div id="speech-log"></div>

  <div id="editor-panel">
    <span id="editor-label">⚡ Claude Edit:</span>
    <input id="editor-input" type="text"
           placeholder="e.g. add a plant near the backend desk, move the coffee machine…" />
    <span id="editor-thinking">Claude thinking…</span>
    <button id="editor-send">Send</button>
    <span id="editor-close" title="Close (Esc)">✕</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
