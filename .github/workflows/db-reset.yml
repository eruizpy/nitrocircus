name: Reset Database

on:
  workflow_dispatch:

jobs:
  reset:
    name: Clear all collections + Redis queues
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Reset via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nitrocircus
            source .env 2>/dev/null || true
            MONGO_USER=${MONGO_USER:-nitro}
            MONGO_PASS=${MONGO_PASS:-nitro}
            MONGO_DB=${MONGO_DB:-nitrocircus}

            echo "==> Clearing MongoDB collections..."
            docker exec nitrocircus-mongo-1 mongosh \
              -u "$MONGO_USER" -p "$MONGO_PASS" \
              --authenticationDatabase admin \
              "$MONGO_DB" --eval "
                db.projects.deleteMany({});
                db.tasks.deleteMany({});
                db.epics.deleteMany({});
                db.agent_runs.deleteMany({});
                db.event_logs.deleteMany({});
                print('MongoDB reset complete');
              "

            echo "==> Flushing Redis queues..."
            docker exec nitrocircus-redis-1 redis-cli FLUSHDB

            echo "==> Done. Database is empty."
