name: Deploy NightCityVerse

on:
  push:
    branches: [main]
    paths:
      - 'nightcityverse/**'
      - '.github/workflows/deploy-nightcityverse.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy NightCityVerse to Linode VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Preparing NightCityVerse checkout..."
            TARGET=/opt/nightcityverse
            if [ ! -d "$TARGET/.git" ]; then
              git clone "$(cd /opt/nitrocircus && git remote get-url origin)" "$TARGET"
            fi

            cd "$TARGET"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing dependencies..."
            npm install

            echo "==> Configuring firewall..."
            ufw allow 4321/tcp  > /dev/null 2>&1 || true
            ufw deny 4322/tcp   > /dev/null 2>&1 || true
            ufw --force enable  > /dev/null 2>&1 || true

            echo "==> Building NightCityVerse..."
            npm run build --workspace=nightcityverse

            echo "==> Restarting NightCityVerse backend..."
            pm2 delete miniverse 2>/dev/null || true
            pm2 delete nightcityverse 2>/dev/null || true
            pm2 start "cd /opt/nightcityverse && NODE_ENV=production NIGHTCITYVERSE_PORT=4322 npm run start --workspace=nightcityverse" --name nightcityverse

            echo "==> Configuring nginx for NightCityVerse..."
            rm -f /etc/nginx/sites-enabled/miniverse /etc/nginx/sites-available/miniverse
            printf '%s\n' \
              'server {' \
              '    listen 4321;' \
              '    root /opt/nightcityverse/nightcityverse/dist;' \
              '    index index.html;' \
              '' \
              '    location /api/ {' \
              '        proxy_pass http://localhost:4322;' \
              '        proxy_http_version 1.1;' \
              '    }' \
              '' \
              '    location /ws {' \
              '        proxy_pass http://localhost:4322;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Upgrade $http_upgrade;' \
              '        proxy_set_header Connection "upgrade";' \
              '    }' \
              '' \
              '    location /assets/ {' \
              '        try_files $uri =404;' \
              '        add_header Cache-Control "public, max-age=31536000, immutable";' \
              '    }' \
              '' \
              '    location = /index.html {' \
              '        add_header Cache-Control "no-store, no-cache, must-revalidate";' \
              '        try_files /index.html =404;' \
              '    }' \
              '' \
              '    location / {' \
              '        add_header Cache-Control "no-store, no-cache, must-revalidate";' \
              '        try_files $uri $uri/ /index.html;' \
              '    }' \
              '}' > /etc/nginx/sites-available/nightcityverse
            ln -sf /etc/nginx/sites-available/nightcityverse /etc/nginx/sites-enabled/nightcityverse
            if command -v nginx &>/dev/null; then
              nginx -t && systemctl reload nginx
            fi

            pm2 save

            echo "==> NightCityVerse health check..."
            for i in 1 2 3 4 5 6; do
              sleep 5
              if curl -sf http://localhost:4322/api/health; then
                break
              fi
              if [ $i -eq 6 ]; then
                echo "NightCityVerse health check failed after 30s"
                exit 1
              fi
              echo "Waiting for NightCityVerse... (attempt $i)"
            done

            echo "==> Deploy complete."
