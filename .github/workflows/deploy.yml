name: Deploy NitroCircus

on:
  push:
    branches: [main]

jobs:
  # ── Type check ────────────────────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npx tsc --noEmit -p apps/bot/tsconfig.json
      - run: npx tsc --noEmit -p workers/agent-runner/tsconfig.json
      - run: npx tsc --noEmit -p apps/web/tsconfig.json

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Linode VPS
    needs: typecheck
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Pulling latest code..."
            cd /opt/nitrocircus
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing dependencies..."
            npm install

            echo "==> Configuring firewall..."
            ufw allow 22/tcp    > /dev/null 2>&1 || true
            ufw allow 80/tcp    > /dev/null 2>&1 || true
            ufw allow 443/tcp   > /dev/null 2>&1 || true
            ufw allow 3001/tcp  > /dev/null 2>&1 || true
            ufw allow 4321/tcp  > /dev/null 2>&1 || true
            ufw deny 3000/tcp   > /dev/null 2>&1 || true
            ufw deny 4322/tcp   > /dev/null 2>&1 || true
            ufw deny 27017/tcp  > /dev/null 2>&1 || true
            ufw deny 6379/tcp   > /dev/null 2>&1 || true
            ufw --force enable  > /dev/null 2>&1 || true

            echo "==> Stopping existing services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans
            sleep 2

            echo "==> Rebuilding Docker services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "==> Preparing isolated runner checkout..."
            RUNNER_REPO=/opt/nitrocircus-runner
            ORIGIN_URL=$(git remote get-url origin)
            if [ ! -d "$RUNNER_REPO/.git" ]; then
              git clone "$ORIGIN_URL" "$RUNNER_REPO"
            fi
            cd "$RUNNER_REPO"
            git remote set-url origin "$ORIGIN_URL"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm install
            cd /opt/nitrocircus

            echo "==> Restarting agent-runner..."
            set -a; . ./.env 2>/dev/null || true; set +a
            export REPO_PATH=/opt/nitrocircus-runner
            export ORCHESTRATOR_URL=http://127.0.0.1:3000
            pm2 delete nitrocircus-agents 2>/dev/null || true
            pm2 start "cd /opt/nitrocircus-runner && npm run start --workspace=workers/agent-runner" --name nitrocircus-agents

            echo "==> Starting NightCityVerse backend (port 4322)..."
            cd /opt/nitrocircus
            npm run build --workspace=apps/miniverse
            pm2 delete miniverse 2>/dev/null || true
            pm2 delete nightcityverse 2>/dev/null || true
            pm2 start "cd /opt/nitrocircus && NODE_ENV=production MINIVERSE_PORT=4322 npm run start --workspace=apps/miniverse" --name nightcityverse
            cd /opt/nitrocircus

            echo "==> Configuring nginx for NightCityVerse (port 4321)..."
            rm -f /etc/nginx/sites-enabled/miniverse /etc/nginx/sites-available/miniverse
            printf '%s\n' \
              'server {' \
              '    listen 4321;' \
              '    root /opt/nitrocircus/apps/miniverse/dist;' \
              '    index index.html;' \
              '' \
              '    location /api/ {' \
              '        proxy_pass http://localhost:4322;' \
              '        proxy_http_version 1.1;' \
              '    }' \
              '' \
              '    location /ws {' \
              '        proxy_pass http://localhost:4322;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Upgrade $http_upgrade;' \
              '        proxy_set_header Connection "upgrade";' \
              '    }' \
              '' \
              '    location /assets/ {' \
              '        try_files $uri =404;' \
              '        add_header Cache-Control "public, max-age=31536000, immutable";' \
              '    }' \
              '' \
              '    location = /index.html {' \
              '        add_header Cache-Control "no-store, no-cache, must-revalidate";' \
              '        try_files /index.html =404;' \
              '    }' \
              '' \
              '    location / {' \
              '        add_header Cache-Control "no-store, no-cache, must-revalidate";' \
              '        try_files $uri $uri/ /index.html;' \
              '    }' \
              '}' > /etc/nginx/sites-available/nightcityverse
            ln -sf /etc/nginx/sites-available/nightcityverse /etc/nginx/sites-enabled/nightcityverse
            if command -v nginx &>/dev/null; then
              nginx -t && systemctl reload nginx
            fi

            pm2 save

            echo "==> Health check..."
            for i in 1 2 3 4 5 6; do
              sleep 5
              if curl -sf http://localhost:3000/health; then
                break
              fi
              if [ $i -eq 6 ]; then
                echo "Health check failed after 30s"
                exit 1
              fi
              echo "Waiting for API... (attempt $i)"
            done

            echo "==> Deploy complete."
