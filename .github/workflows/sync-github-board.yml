name: Sync GitHub Board

on:
  workflow_dispatch:

jobs:
  sync:
    name: Force-sync task states to GitHub Projects board
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Sync via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nitrocircus
            source .env 2>/dev/null || true

            node -e "
            const { MongoClient } = require('mongodb');

            const STATE_TO_LABEL = {
              planned: 'status:planned', assigned: 'status:planned',
              awaiting_start_approval: 'status:planned',
              in_progress: 'status:in_progress', blocked: 'status:blocked',
              in_review: 'status:in_review', done: 'status:done', delivered: 'status:done',
            };

            const STATE_TO_PROJECT = {
              backlog: 'backlog', planned: 'ready', assigned: 'ready',
              awaiting_start_approval: 'ready', in_progress: 'progress',
              blocked: 'progress', in_review: 'review', done: 'done', delivered: 'done',
            };

            const OWNER  = process.env.GITHUB_OWNER;
            const REPO   = process.env.GITHUB_REPO;
            const TOKEN  = process.env.GITHUB_TOKEN;
            const PROJ_N = parseInt(process.env.GITHUB_PROJECT_NUMBER || '1', 10);
            const headers = { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' };

            async function ghFetch(path, method, body) {
              const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
              return r.json();
            }

            async function ghGraphQL(query, vars) {
              const r = await fetch('https://api.github.com/graphql', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables: vars }) });
              const j = await r.json();
              if (j.errors) throw new Error(j.errors.map(e => e.message).join('; '));
              return j.data;
            }

            async function loadProjectConfig() {
              const data = await ghGraphQL(
                \`query(\\\$login: String!, \\\$number: Int!) { user(login: \\\$login) { projectV2(number: \\\$number) { id fields(first: 20) { nodes { __typename ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }\`,
                { login: OWNER, number: PROJ_N }
              );
              const pv2 = data.user.projectV2;
              const sf = pv2.fields.nodes.find(n => n.name === 'Status');
              return { projectId: pv2.id, statusFieldId: sf.id, options: sf.options };
            }

            async function main() {
              const mongo = new MongoClient(process.env.MONGO_URI || 'mongodb://nitro:nitro@localhost:27017/nitrocircus?authSource=admin');
              await mongo.connect();
              const db = mongo.db(process.env.MONGO_DB || 'nitrocircus');

              const tasks = await db.collection('tasks').find({ githubIssueNumber: { \$exists: true, \$ne: null } }).toArray();
              console.log('Tasks with GitHub issue:', tasks.length);

              const cfg = await loadProjectConfig();
              let synced = 0;

              for (const task of tasks) {
                try {
                  const statusLabel = STATE_TO_LABEL[task.state];

                  // Update issue labels
                  const issue = await ghFetch('/issues/' + task.githubIssueNumber, 'GET');
                  const labels = issue.labels.map(l => l.name).filter(n => !n.startsWith('status:'));
                  if (statusLabel) labels.push(statusLabel);
                  const isClosed = task.state === 'done' || task.state === 'delivered';
                  await ghFetch('/issues/' + task.githubIssueNumber, 'PATCH', { labels, state: isClosed ? 'closed' : 'open' });

                  // Update project board column
                  if (task.githubProjectItemId) {
                    const kw = STATE_TO_PROJECT[task.state];
                    const opt = cfg.options.find(o => o.name.toLowerCase().includes(kw));
                    if (opt) {
                      await ghGraphQL(
                        \`mutation(\\\$p: ID!, \\\$i: ID!, \\\$f: ID!, \\\$v: String!) { updateProjectV2ItemFieldValue(input: { projectId: \\\$p, itemId: \\\$i, fieldId: \\\$f, value: { singleSelectOptionId: \\\$v } }) { projectV2Item { id } } }\`,
                        { p: cfg.projectId, i: task.githubProjectItemId, f: cfg.statusFieldId, v: opt.id }
                      );
                    }
                  }

                  console.log('Synced #' + task.githubIssueNumber + ' (' + task.title.slice(0, 40) + ') → ' + task.state);
                  synced++;
                } catch(e) {
                  console.warn('Failed #' + task.githubIssueNumber + ':', e.message);
                }
              }

              console.log(synced + '/' + tasks.length + ' synced');
              await mongo.close();
            }

            main().catch(e => { console.error(e); process.exit(1); });
            "
